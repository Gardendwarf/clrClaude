<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <script>
      // Apply theme before first paint to prevent flash.
      // Default light; stored preference wins, else honour prefers-color-scheme.
      (function(){try{var t=localStorage.getItem('clrclaude_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clrClaude -- Master Claude Code</title>
    <meta name="description" content="A visual, hands-on training platform for Claude Code -- from basics to advanced agents." />
    <link rel="icon" type="image/x-icon" href="https://assets.clrtech.xyz/clr-group/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://assets.clrtech.xyz/clr-group/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://assets.clrtech.xyz/clr-group/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://assets.clrtech.xyz/clr-group/apple-touch-icon.png" />
    <meta property="og:image" content="https://assets.clrtech.xyz/clr-group/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
